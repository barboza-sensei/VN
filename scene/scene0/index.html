<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escena 0 — La calle sin principio</title>
  
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* Estilos locales para la atmósfera de esta escena */
    body {
        /* RUTA CORREGIDA */
        background-image: url('assets/bg/calle_oscura_sin_luces_inicio.jpg'); 
        background-color: #0d0d0d;
        background-size: cover; 
        background-position: center;
        transition: background-image 1s ease-in-out; 
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: flex-end; /* Alinea la caja de diálogo en la parte inferior */
    }
    
    .dialogue-box {
        position: relative;
        color: #f0f0f0;
        font-family: 'Georgia', serif;
        line-height: 1.6;
        z-index: 100;
    }

    #main-dialogue-box { 
        position: absolute; 
        bottom: 5vh; 
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 800px;
        padding: 1.5em;
        background-color: rgba(15, 15, 15, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    
    #text {
        min-height: 2.5em; 
        margin: 0 0 15px 0;
        font-size: 1.2em;
        opacity: 1;
        transition: opacity 0.3s ease;
    }

    #text.fade-text {
        opacity: 1; 
    }
    
    .disparia-voice {
        color: #ff9933;
        font-weight: bold;
    }

    #nextBtn {
        position: absolute;
        bottom: 1.5em;
        right: 1.5em;
        background: transparent;
        border: none;
        color: #f0f0f0;
        font-size: 1.8em;
        cursor: pointer;
        padding: 0;
        transition: color 0.2s ease, opacity 0.2s ease;
        opacity: 1;
        
        text-indent: 0; 
        overflow: visible; 
    }
    
    #nextBtn:hover:not(:disabled) {
        color: #aaffff;
    }

    #nextBtn:disabled {
        opacity: 0.3;
        cursor: default;
    }

    #nextBtn::after {
        content: '›' !important; 
        visibility: visible !important;
    }

    #choices {
        display: flex;
        flex-direction: column;
        gap: 0; 
        margin-top: 15px; 
    }

    .choice-btn {
        background: rgba(0, 0, 0, 0.4); 
        border: none;
        border-radius: 0; 
        color: #f0f0f0;
        padding: 12px 15px;
        font-size: 1.1em;
        text-align: left; 
        transition: all 0.2s ease;
        cursor: pointer;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
    }

    .choice-btn:hover, .choice-btn:focus {
        background: rgba(40, 40, 40, 0.6); 
        box-shadow: 0 0 0 1px #aaffff; 
        color: #aaffff; 
        outline: none; 
    }

    #choices .choice-btn:last-child {
        border-bottom: none; 
    }
  </style>
</head>

<body>
    <audio id="backgroundMusic" src="assets/sfx/footsteps.wav" autoplay loop></audio>

    <div class="dialogue-box" id="main-dialogue-box">
        <p id="text"></p>
        <div id="choices"></div>
        <button id="nextBtn" style="display: none;" title="Continuar">➤</button> 
    </div>

    <script src="../../global.js"></script> 

    <script>
      // ******************************************************
      // ESTRUCTURA DE LA ESCENA CON ARCHIVOS DE AUDIO ASOCIADOS
      // ******************************************************
      const scene0 = {
        id: 0,
        title: "La calle sin principio",
        text: [
          { type: 'narrative', audio: '00_01.wav', content: "Despertás de pie, en el centro exacto de la calle. Intentás recordar de dónde venís o hacia dónde ibas, pero tu mente esta en blanco, no lográs recordar nada."}, 
          { type: 'narrative', audio: '00_02.wav', content: "La calle es una línea perfecta, fríamente recta, que se extiende hasta desvanecerse en la oscuridad."}, 
          { type: 'narrative', audio: '00_03.wav', content: "Los faroles son meros bocetos de metal, estructuras desnudas y sin luz."}, 
          { type: 'narrative', audio: '00_04.wav', content: "Una brisa tenue, predecible, te empuja con una insistencia sutil hacia adelante."}, 
          { type: 'narrative', audio: '00_05.wav', content: "A tu izquierda, la esquina. Una vidriera opaca, rota por una grieta que parece un error en el patrón del mundo."}, 
          { type: 'narrative', audio: '00_06.wav', content: "A tu derecha, un callejón estrecho y oscuro. Su hedor a lluvia antigua es lo único que ancla este lugar a lo orgánico."}, 
          { type: 'voice', speaker: 'Murmullo', audio: '00_07d.mp3', content: "La elección define el primer movimiento en esta realidad."} 
        ],
        choices: [
          { text: "Doblar a la izquierda (Esquina)", nextScene: "../scene1/index.html" },
          { text: "Doblar a la derecha (Callejón)", nextScene: "../scene1/index.html" }
        ]
      };

      const textEl = document.getElementById("text");
      const choicesEl = document.getElementById("choices");
      const nextBtn = document.getElementById("nextBtn");

      let i = 0;
      
      const IMG_GENERAL = 'assets/bg/calle_oscura_sin_luces_inicio.jpg'; 
      const IMG_CALLEJON = 'assets/bg/calle_oscura_sin_luces_cerca_callejon.png'; 
      const IMG_ESQUINA = 'assets/bg/calle_oscura_sin_luces_cerca_esquina.jpg'; 
      
      // ******************************************************
      // CONFIGURACIÓN DE AUDIO LOCAL
      // ******************************************************
      // RUTA CORREGIDA
      const VOICE_PATH = 'assets/voice/'; 
      let currentAudio = null; 

      // Referencia a la música de fondo
      let backgroundMusic = document.getElementById('backgroundMusic');
      
      function changeBackground(imageUrl) {
          document.body.style.backgroundImage = `url('${imageUrl}')`;
      }

      function stopCurrentAudio() {
          if (currentAudio) {
              currentAudio.pause();
              currentAudio.currentTime = 0;
              currentAudio = null;
          }
      }

      function showLine() {
        stopCurrentAudio(); 
          
        if (i >= scene0.text.length) {
            nextBtn.style.display = 'none';
            return;
        }
        
        // LÓGICA DE CAMBIO DE FONDO 
        if (i === 4) { 
            changeBackground(IMG_ESQUINA);
        } else if (i === 5) {
            changeBackground(IMG_CALLEJON); 
        }
        
        const lineData = scene0.text[i];
        textEl.className = 'fade-text';

        // 🚨 Muestra el texto (siempre debe mostrarse)
        if (lineData.type === 'voice') {
            const voiceClass = 'disparia-voice';
            textEl.innerHTML = `<span class="${voiceClass}">${lineData.speaker}: ${lineData.content}</span>`;
        } else {
            textEl.textContent = lineData.content;
        }

        // 🚨 INTEGRACIÓN DE VOZ Y CONTROL DE NEXT BUTTON 🚨
        // Verificamos si la variable global isVoiceActive está definida Y activa
        const shouldPlayVoice = typeof isVoiceActive !== 'undefined' && isVoiceActive;
        const hasAudio = lineData.audio;
        
        if (shouldPlayVoice && hasAudio) {
            // Caso 1: Voz ON y Audio disponible -> Reproducir y deshabilitar Next
            currentAudio = new Audio(VOICE_PATH + lineData.audio); 
            
            // Usamos .then/.catch para manejar la reproducción asíncrona y errores
            currentAudio.play().then(() => {
                nextBtn.disabled = true;
            }).catch(error => {
                console.warn("No se pudo reproducir la voz. Habilitando Next.", error);
                // Si la reproducción falla (p.ej., audio no existe o error del navegador)
                nextBtn.disabled = false;
            });
            
            currentAudio.onended = () => {
                nextBtn.disabled = false;
                if (i === scene0.text.length - 1) {
                    showChoices();
                }
            };

        } else {
            // Caso 2: Voz OFF, Audio no disponible, o global.js aún no cargó -> Habilitar Next inmediatamente
            nextBtn.disabled = false;
            if (i === scene0.text.length - 1) {
                showChoices();
            }
        }

        // Mostrar u ocultar el botón de avance
        nextBtn.style.display = i < scene0.text.length - 1 || i === scene0.text.length - 1 && !nextBtn.disabled ? "inline-flex" : "none";
        
        void textEl.offsetWidth; 
      }

      nextBtn.addEventListener("click", () => {
        stopCurrentAudio(); 
        if (i < scene0.text.length - 1) {
          i++;
          showLine();
        }
      });

      function showChoices() {
        choicesEl.innerHTML = "";
        scene0.choices.forEach(c => {
          const btn = document.createElement("button");
          btn.textContent = c.text;
          btn.className = 'choice-btn'; 
          btn.onclick = () => goTo(c.nextScene);
          choicesEl.appendChild(btn);
        });
        nextBtn.style.display = 'none'; 
      }

      function goTo(relativePath) {
        if (backgroundMusic) {
            backgroundMusic.pause();
        }
        
        const base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        const resolved = new URL(relativePath, base).href;
        window.location.href = resolved;
      }
      
      // Iniciar la escena después de que todo el DOM y global.js se hayan cargado.
      document.addEventListener('DOMContentLoaded', () => {
          // 🚨 AÑADIMOS UN LIGERO RETRASO para asegurar que global.js haya terminado
          // de inicializar TODAS sus variables (incluyendo isVoiceActive) antes de llamar a showLine().
          setTimeout(showLine, 50); 
      });

    </script>

</body>
  </html>
